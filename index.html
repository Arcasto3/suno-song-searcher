<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suno Song Searcher</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 Suno Song Searcher</h1>
            <p class="subtitle">Search millions of AI-generated songs</p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search by title, artist, or genre..." 
                    autocomplete="off"
                >
                <button id="searchBtn" class="search-btn">Search</button>
            </div>

            <div class="filters">
                <select id="genreFilter" class="filter-select">
                    <option value="">All Genres</option>
                    <option value="pop">Pop</option>
                    <option value="rock">Rock</option>
                    <option value="hip-hop">Hip-Hop</option>
                    <option value="electronic">Electronic</option>
                    <option value="indie">Indie</option>
                    <option value="jazz">Jazz</option>
                    <option value="classical">Classical</option>
                    <option value="lo-fi">Lo-Fi</option>
                    <option value="ambient">Ambient</option>
                </select>

                <select id="moodFilter" class="filter-select">
                    <option value="">All Moods</option>
                    <option value="energetic">Energetic</option>
                    <option value="chill">Chill</option>
                    <option value="sad">Sad</option>
                    <option value="happy">Happy</option>
                    <option value="dark">Dark</option>
                    <option value="uplifting">Uplifting</option>
                </select>

                <select id="sortBy" class="filter-select">
                    <option value="relevance">Sort by Relevance</option>
                    <option value="newest">Newest First</option>
                    <option value="popular">Most Popular</option>
                    <option value="views">Most Viewed</option>
                </select>
            </div>
        </div>

        <div class="results-info">
            <span id="resultsCount">0 results found</span>
            <button id="clearBtn" class="clear-btn" style="display:none;">Clear All</button>
        </div>

        <div class="results-container" id="resultsContainer">
            <div class="no-results">
                <p>🔍 Start searching to discover songs</p>
            </div>
        </div>

        <div class="loading" id="loadingSpinner" style="display:none;">
            <div class="spinner"></div>
            <p>Searching for songs...</p>
        </div>

        <!-- Download Progress Modal -->
        <div class="modal" id="downloadModal" style="display:none;">
            <div class="modal-content">
                <h2>📥 Downloading</h2>
                <p id="downloadSongName"></p>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p id="downloadStatus">0%</p>
            </div>
        </div>

        <!-- Toast notification -->
        <div class="toast" id="toast"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
